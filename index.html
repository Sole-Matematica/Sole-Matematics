<style>
:root{
 --primary:#1a3a6c;
 --secondary:#2c5282;
 --accent:#e53e3e;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
 font-family:Roboto,sans-serif;
 color:#1a202c;
 overflow-x:hidden;
 background:#f8fafc;
}

/* GLASS HEADER */
header{
 position:fixed;
 top:0;
 width:100%;
 backdrop-filter: blur(12px);
 background:rgba(26,58,108,0.7);
 color:white;
 z-index:1000;
}

nav{
 max-width:1200px;
 margin:auto;
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:1rem;
}

nav ul{
 display:flex;
 gap:1.5rem;
 list-style:none;
}

nav a{
 color:white;
 text-decoration:none;
 position:relative;
}

nav a::after{
 content:'';
 position:absolute;
 bottom:-3px;
 left:0;
 width:0;
 height:2px;
 background:#ffd700;
 transition:.3s;
}

nav a:hover::after{width:100%}

/* HERO */
.hero{
 position:relative;
 height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 overflow:hidden;
}

/* MATH BACKGROUND */
.bg{
 position:absolute;
 inset:0;
 z-index:1;
 opacity:0.07;
}

.math{
 font-family:Merriweather;
 fill:var(--primary);
}

/* TOPOLOGY */
.torus{
 stroke:var(--secondary);
 fill:none;
 stroke-width:2;
 opacity:0.3;
}

.mobius{
 stroke:var(--primary);
 fill:none;
 stroke-dasharray:6 3;
 opacity:0.4;
}

/* FLOAT */
@keyframes float{
 0%,100%{transform:translateY(0)}
 50%{transform:translateY(-15px)}
}
.float{animation:float 14s infinite}

/* CONTENT */
.content{
 z-index:2;
 max-width:750px;
}

h1{
 font-family:Merriweather;
 font-size:2.6rem;
 margin-bottom:1rem;
}

p{
 font-size:1.2rem;
 margin-bottom:1.5rem;
}

.btn{
 background:var(--accent);
 color:white;
 padding:0.9rem 1.8rem;
 border-radius:30px;
 text-decoration:none;
}

/* SECTIONS */
section{padding:5rem 1rem}

.container{
 max-width:1100px;
 margin:auto;
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
 gap:2rem;
}

.card{
 background:white;
 padding:2rem;
 border-radius:12px;
 box-shadow:0 10px 25px rgba(0,0,0,0.1);
 transition:.3s;
}

.card:hover{
 transform:translateY(-5px);
}

/* MOBILE */
@media(max-width:768px){
 nav ul{display:none}
}
</style>

</head>

<script>
const btn=document.getElementById('lang');
const elements=document.querySelectorAll('.i18n');

btn.onclick=()=>{
 const html=document.documentElement;
 const newLang=html.lang==='it'?'fa':'it';

 html.lang=newLang;
