    <script>
        // Language Toggle
        function toggleLanguage() {
            const html = document.documentElement;
            const currentLang = html.getAttribute('lang');
            const newLang = currentLang === 'it' ? 'fa' : 'it';
            const newDir = newLang === 'fa' ? 'rtl' : 'ltr';
            
            html.setAttribute('lang', newLang);
            html.setAttribute('dir', newDir);
            
            document.querySelectorAll('.i18n').forEach(el => {
                const newText = el.getAttribute(`data-${newLang}`);
                if(newText) el.innerHTML = newText; // Use innerHTML to preserve <span> highlights inside text
            });
            
            document.querySelector('.lang-toggle').textContent = newLang === 'fa' ? '🇮🇷 FA / 🇮🇹 IT' : '🇮🇹 IT / 🇮🇷 FA';
        }

        // Mobile Menu
        document.getElementById('mobile-menu-btn').addEventListener('click', function() {
            const navMenu = document.getElementById('nav-menu');
            navMenu.style.display = navMenu.style.display === 'flex' ? 'none' : 'flex';
        });
        
        // Smooth Scrolling
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                const targetId = this.getAttribute('href');
                if(targetId === '#') return;
                const targetElement = document.querySelector(targetId);
                if(targetElement) {
                    window.scrollTo({ top: targetElement.offsetTop - 80, behavior: 'smooth' });
                    if(window.innerWidth <= 768) document.getElementById('nav-menu').style.display = 'none';
                }
            });
        });
        
        window.addEventListener('resize', function() {
            if(window.innerWidth > 768) document.getElementById('nav-menu').style.display = 'flex';
        });
    </script>
