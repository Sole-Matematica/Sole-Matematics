<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sole Matematica - Advanced</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#1a3a6c;
  --secondary:#2c5282;
}

body{
  margin:0;
  font-family:Roboto,sans-serif;
  overflow-x:hidden;
}

/* HERO */
.hero{
  position:relative;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#1a3a6c;
  background:#f8fafc;
  overflow:hidden;
}

.hero h1{
  font-family:Merriweather,serif;
  font-size:2.5rem;
  z-index:2;
}

/* SVG BACKGROUND */
.bg{
  position:absolute;
  inset:0;
  z-index:1;
  opacity:0.15;
}

.math{
  font-family:Merriweather;
  fill:#1a3a6c;
}

/* ANIMATION */
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-15px)}
}

.float{animation:float 12s infinite ease-in-out}

</style>
</head>

<body>

<section class="hero">

<svg class="bg" viewBox="0 0 1000 600">

<!-- Euler Identity -->
<text x="50" y="100" class="math" font-size="28">e^{i\pi} + 1 = 0</text>

<!-- Integral -->
<text x="600" y="150" class="math float" font-size="24">\int_0^\infty e^{-x^2} dx = \frac{\sqrt{\pi}}{2}</text>

<!-- Maxwell Equation -->
<text x="200" y="300" class="math" font-size="20">\nabla \cdot E = \frac{\rho}{\varepsilon_0}</text>

<!-- Torus (topology) -->
<path d="M500 350 C650 250,850 450,650 550 C450 650,250 450,500 350 Z" stroke="#2c5282" fill="none" stroke-width="2"/>
<path d="M520 370 C630 300,780 450,630 520 C520 600,370 450,520 370 Z" stroke="#2c5282" fill="none" stroke-width="1.5"/>

<!-- Mobius strip -->
<path d="M150 450 Q250 350 350 450 Q250 550 150 450 Z" stroke="#1a3a6c" fill="none" stroke-dasharray="4 3"/>

</svg>

<div>
<h1>Lezioni di Matematica e Fisica</h1>
<p>Metodo avanzato • Approccio scientifico • Risultati garantiti</p>
</div>

</section>

<script>
// simple smooth scroll improvement

document.addEventListener('click', e=>{
 const a=e.target.closest('a[href^="#"]');
 if(!a) return;
 e.preventDefault();
 document.querySelector(a.getAttribute('href'))?.scrollIntoView({behavior:'smooth'});
});
</script>

</body>
</html>
